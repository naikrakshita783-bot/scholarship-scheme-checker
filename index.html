<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scholarship - Login</title>
<style>
body{font-family:Arial;background:linear-gradient(135deg,#0d6efd,#6610f2);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;margin:0}
.card{background:white;padding:30px;border-radius:16px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
h2{text-align:center} p{text-align:center;color:#666;font-size:14px}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1.5px solid #ddd;font-size:16px;box-sizing:border-box}
button{background:#0d6efd;color:white;border:none;font-weight:bold;cursor:pointer}
#msg{text-align:center;color:green;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h2>🎓 Scholarship Portal</h2>
<p>Free OTP Login</p>
<input id="phone" placeholder="Enter Mobile No: 9876543210">
<button onclick="sendOTP()">Send OTP</button>
<div id="otpBox" style="display:none">
<input id="otp" placeholder="Enter OTP">
<button onclick="verifyOTP()" style="background:#198754">Verify & Login</button>
</div>
<p id="msg"></p>
</div>
<script>
let realOTP = "";
function sendOTP(){
 let phone = document.getElementById('phone').value;
 if(phone.length < 10){ alert('Enter valid 10 digit number'); return; }
 realOTP = Math.floor(100000 + Math.random()*900000);
 alert("Your OTP is: " + realOTP + "\n(In real project this SMS goes to " + phone + ")");
 document.getElementById('otpBox').style.display='block';
 document.getElementById('msg').innerText = "OTP sent to " + phone + " (Demo: " + realOTP + ")";
}
function verifyOTP(){
 if(document.getElementById('otp').value == realOTP){
  localStorage.setItem('userPhone', document.getElementById('phone').value);
  window.location.href = "dashboard.html";
 } else { alert('Wrong OTP'); }
}
</script>
</body>
</html>
