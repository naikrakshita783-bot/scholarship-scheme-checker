<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheme Checker</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Arial;background:#eef2f7;margin:0;padding:12px;display:flex;justify-content:center}
.card{background:#fff;width:100%;max-width:480px;padding:20px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
h2{text-align:center;margin:0 0 10px}
input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ccc;box-sizing:border-box;font-size:15px}
button{background:#0f9d58;color:#fff;font-weight:bold;border:none}
button:disabled{background:#999}
.ok{background:#d4edda;color:#155724;padding:14px;border-radius:10px;text-align:center;font-weight:bold;margin-top:12px}
.fail{background:#f8d7da;color:#721c24;padding:14px;border-radius:10px;text-align:center;font-weight:bold;margin-top:12px}
#ocr{font-size:10px;background:#f5f5f5;padding:8px;border-radius:6px;white-space:pre-wrap;max-height:100px;overflow:auto}
</style>
</head>
<body>
<div class="card">
<h2>VTU Scheme Checker</h2>
<select id="cat">
<option value="">Select Category</option>
<option>OBC-2A</option><option>SC</option><option>ST</option><option>General</option>
</select>
<input id="income" type="number" placeholder="Family Income" value="30000">
<input id="file" type="file" accept="image/*">
<p id="status" style="font-size:13px;background:#fff3cd;padding:8px;border-radius:8px;display:none"></p>
<div id="ocrbox" style="display:none"><div id="ocr"></div></div>
<button id="btn" disabled>Upload Marks Card First</button>
<div id="res"></div>
</div>

<script>
let CGPA=0, PER=0;

document.getElementById('file').addEventListener('change', async (e)=>{
  let file = e.target.files[0];
  if(!file) return;
  let s = document.getElementById('status');
  s.style.display='block';
  s.innerText='Reading... wait 10 sec';
  document.getElementById('btn').disabled=true;

  try{
    let {data:{text}} = await Tesseract.recognize(file,'eng');
    document.getElementById('ocr').innerText=text.slice(0,500);
    document.getElementById('ocrbox').style.display='block';

    // Find CGPA
    let cg=0;
    let m = text.match(/([0-9]\.[0-9]{1,2})/g);
    if(m){
      // take last decimal which is usually CGPA
      for(let v of m){ let n=parseFloat(v); if(n>=4 && n<=10) cg=n; }
    }
    // fallback if 865 -> 8.65
    if(cg==0){
      let m2=text.match(/([0-9]{3})/);
      if(m2) cg=parseFloat(m2[1][0]+'.'+m2[1].slice(1));
    }
    CGPA=cg;
    PER=cg? Math.round((cg-0.5)*10*10)/10 : 0;

    s.innerText=`Found: CGPA ${CGPA} = ${PER}%`;
    document.getElementById('btn').disabled=false;
    document.getElementById('btn').innerText=`Check Eligibility - ${PER}%`;
  }catch(err){
    s.innerText='Error reading: '+err.message;
  }
});

function checkEligibility(){
  let cat=document.getElementById('cat').value;
  let inc=document.getElementById('income').value;
  let r=document.getElementById('res');
  if(!cat){ r.innerHTML='<div class=fail>Select Category</div>'; return; }
  if(CGPA==0){ r.innerHTML='<div class=fail>Upload clear original marks card</div>'; return; }
  if(inc>1000000){ r.innerHTML='<div class=fail>❌ Income >10L - Not Eligible</div>'; return; }

  // VTU Rule: CGPA >=4 = PASS
  if(CGPA>=4){
    r.innerHTML=`<div class=ok>✅ ELIGIBLE<br>CGPA ${CGPA} = ${PER}%<br>Result: PASS - All Clear</div>`;
  }else{
    r.innerHTML=`<div class=fail>❌ NOT ELIGIBLE<br>CGPA ${CGPA} < 4.0 - FAIL</div>`;
  }
}
document.getElementById('btn').onclick=checkEligibility;
</script>
</body>
</html>
