<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal Checker</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>body{font-family:Arial;background:#f4f6f9;display:flex;justify-content:center;padding:15px;margin:0}.card{background:white;padding:22px;border-radius:18px;width:100%;max-width:520px}input,select,button{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}button{background:#0f9d58;color:white;font-weight:bold}button:disabled{background:gray}#box{background:#eef2ff;padding:12px;border-radius:10px;display:none}.ok{background:#d4edda;padding:14px;border-radius:12px;margin-top:14px;color:#155724;font-weight:bold;text-align:center}.fail{background:#f8d7da;padding:14px;border-radius:12px;margin-top:14px;color:#721c24;font-weight:bold;text-align:center}</style>
</head><body><div class="card">
<h2 style="text-align:center">✅ Universal - All Cards</h2>
<select id="cat"><option value="">Select Category</option><option>OBC-2A</option><option>SC</option><option>ST</option><option>General</option></select>
<input id="income" type="number" value="30000">
<input id="file" type="file" accept="image/*">
<div id="box"><p id="status"></p><p id="calc" style="background:#fff3cd;padding:10px;border-radius:8px;font-size:13px"></p><details><summary style="font-size:11px">OCR</summary><p id="raw" style="font-size:9px;white-space:pre-wrap"></p></details></div>
<button id="btn" onclick="go()" disabled>Upload Any Marks Card</button><div id="res"></div></div>
<script>
let DATA={cgpa:0,perc:0,pass:true,valid:false,p:0,f:0};
function countPF(t){let p=0,f=0;for(let l of t.split('\n')){let u=l.trim().toUpperCase();if(/BCS|BEC|BME|BCE|\b\d{2}[A-Z]{2,}/.test(u)||(u.length>15&&/\d/.test(u))){if(/\sF\s*$/.test(u)||/\sF$/.test(u))f++;else if(/\sP\s*$/.test(u)||/\sP$/.test(u))p++;}}return{p,f};}
document.getElementById('file').addEventListener('change',async(e)=>{
let file=e.target.files[0];if(!file)return;document.getElementById('box').style.display='block';document.getElementById('status').innerText="🤖 Reading...";document.getElementById('btn').disabled=true;
const{data:{text}}=await Tesseract.recognize(file,'eng');document.getElementById('raw').innerText=text;
let cgpa=0,raw="";let m=text.match(/(?:CGPA|CePA|SGPA)[^0-9]*([0-9]\.[0-9]{1,2})/i);if(m){cgpa=parseFloat(m[1]);raw=m[0];}if(!cgpa){let m2=text.match(/(?:CGPA|CePA|SGPA)[^0-9]*([0-9]{3})/i);if(m2){let v=m2[1];cgpa=parseFloat(v[0]+'.'+v.slice(1));raw=m2[0]+"=>"+cgpa;}}if(cgpa>10)cgpa/=100;let perc=Math.round((cgpa-0.5)*10*10)/10;let pf=countPF(text);let pass=pf.f==0&&cgpa>=4;DATA={cgpa,perc,pass,valid:cgpa>0,p:pf.p,f:pf.f};
document.getElementById('status').innerHTML="✅ Done";document.getElementById('calc').innerHTML=`CGPA ${cgpa} (${raw}) = ${perc}%<br>P=${pf.p} F=${pf.f} => ${pass?'PASS':'FAIL'}`;document.getElementById('btn').disabled=false;document.getElementById('btn').innerText=`Check - ${perc}% ${pass?'PASS':'FAIL'}`;});
function go(){let cat=document.getElementById('cat').value,inc=document.getElementById('income').value,r=document.getElementById('res');if(!cat||!DATA.valid){alert('Select cat & upload');return;}if(inc>1000000){r.innerHTML='<div class=fail>❌ Income >10L</div>';return;}if(!DATA.pass){r.innerHTML=`<div class=fail>❌ FAIL - Found ${DATA.f} F</div>`;return;}r.innerHTML=`<div class=ok>✅ ELIGIBLE<br>${DATA.cgpa}=${DATA.perc}%<br>P=${DATA.p} F=${DATA.f} PASS</div>`;}
</script></body></html>
