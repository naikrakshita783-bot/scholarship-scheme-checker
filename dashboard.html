<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTU Scheme Checker</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial;background:#f0f4f8;display:flex;justify-content:center;padding:15px}
.box{background:#fff;width:100%;max-width:450px;padding:20px;border-radius:20px;box-shadow:0 8px 20px rgba(0,0,0,.1)}
h2{text-align:center;color:#222} input,select,button{width:100%;padding:13px;margin:9px 0;border-radius:12px;border:1px solid #ccc;font-size:15px}
button{background:#1a73e8;color:#fff;border:none;font-weight:bold;cursor:pointer} button:active{transform:scale(.98)}
.ok{background:#e6f4ea;color:#137333;padding:15px;border-radius:12px;text-align:center;font-weight:bold;margin-top:15px}
.no{background:#fce8e6;color:#a50e0e;padding:15px;border-radius:12px;text-align:center;font-weight:bold;margin-top:15px}
.info{font-size:12px;background:#e8f0fe;padding:10px;border-radius:10px;text-align:center}
.hide{display:none} #text{font-size:10px;background:#f8f9fa;padding:10px;border-radius:10px;white-space:pre-wrap;max-height:120px;overflow:auto;margin-top:10px}
.small{font-size:12px;color:#555;text-align:center}
</style>
</head>
<body>
<div class="box">

<!-- LOGIN -->
<div id="login">
<h2>Login</h2>
<div class="info">College Project - Email OTP Demo</div>
<input id="email" type="email" placeholder="Enter your email">
<button onclick="sendOTP()">Send OTP</button>
<div id="err"></div>
<div id="otpBox" class="hide">
<input id="otpIn" type="number" placeholder="Enter 6 digit OTP">
<button onclick="checkOTP()">Verify OTP</button>
<div id="showOtp" class="small"></div>
</div>
</div>

<!-- APP -->
<div id="app" class="hide">
<h2>VTU Scheme Checker <button onclick="logout()" style="width:auto;padding:5px 12px;font-size:12px;background:#d93025;float:right">Logout</button></h2>
<p id="userEmail" class="small"></p>
<select id="cat"><option value="">Select Category</option><option>OBC</option><option>SC</option><option>ST</option><option>General</option></select>
<input id="inc" type="number" placeholder="Family Income (ex: 30000)" value="30000">
<input id="file" type="file" accept="image/*">
<p id="status" class="info hide"></p>
<div id="text"></div>
<button id="checkBtn" disabled>Upload Marks Card First</button>
<div id="result"></div>
</div>

</div>

<script>
let OTP="", CGPA=0, PER=0, FCOUNT=0, PCOUNT=0;

// LOGIN SYSTEM - DEMO OTP (works on GitHub Pages)
function sendOTP(){
  let e=document.getElementById('email').value.trim();
  if(!e.includes('@')){ document.getElementById('err').innerHTML='<div class=no>Enter valid email</div>'; return; }
  OTP = ""+Math.floor(100000+Math.random()*900000);
  localStorage.setItem('otp',OTP); localStorage.setItem('email',e);
  document.getElementById('otpBox').classList.remove('hide');
  document.getElementById('err').innerHTML='<div class=ok>OTP sent to '+e+'</div>';
  document.getElementById('showOtp').innerHTML='Demo OTP: <b style="color:green;font-size:20px">'+OTP+'</b><br>(In real project, goes to email via EmailJS)';
}
function checkOTP(){
  if(document.getElementById('otpIn').value.trim()===localStorage.getItem('otp')){
    localStorage.setItem('login','yes'); showApp();
  } else { document.getElementById('err').innerHTML='<div class=no>Wrong OTP. Demo is '+localStorage.getItem('otp')+'</div>'; }
}
function showApp(){
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList
