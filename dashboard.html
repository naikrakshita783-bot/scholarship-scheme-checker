<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VTU Scheme Eligibility Checker - College Project</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Arial;background:#eef2f7;display:flex;justify-content:center;padding:12px;margin:0}
.card{background:#fff;max-width:480px;width:100%;padding:20px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
h2{text-align:center} input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}
button{background:#0f9d58;color:#fff;font-weight:bold;border:none}.hidden{display:none}
.ok{background:#d4edda;padding:14px;border-radius:10px;text-align:center;font-weight:bold;color:#155724;margin-top:12px}
.fail{background:#f8d7da;padding:14px;border-radius:10px;text-align:center;font-weight:bold;color:#721c24;margin-top:12px}
#ocr{font-size:9px;background:#f5f5f5;padding:8px;border-radius:6px;white-space:pre-wrap;max-height:100px;overflow:auto}
</style>
</head>
<body>
<div class="card">
<!-- LOGIN -->
<div id="loginPage">
<h2>College Project - Login</h2>
<input id="email" type="email" placeholder="Enter college email">
<button onclick="sendOTP()">Send OTP</button>
<div id="loginErr"></div>
<div id="otpPage" class="hidden">
<input id="otpInput" placeholder="Enter OTP">
<button onclick="verifyOTP()">Verify OTP</button>
<p id="otpShow" style="text-align:center;font-size:12px"></p>
</div>
</div>
<!-- DASHBOARD -->
<div id="dashPage" class="hidden">
<h2>VTU Scheme Checker <button onclick="logout()" style="width:auto;background:#dc3545;padding:5px 10px;float:right;font-size:11px">Logout</button></h2>
<p id="uname" style="text-align:center;font-size:12px"></p>
<select id="cat"><option value="">Category</option><option>OBC-2A</option><option>SC</option><option>ST</option><option>General</option></select>
<input id="income" type="number" value="30000" placeholder="Family Income">
<input id="file" type="file" accept="image/*">
<p id="status" style="display:none;background:#e3f2fd;padding:8px;border-radius:8px;font-size:13px"></p>
<div id="ocr"></div>
<button id="btn" disabled>Upload Marks Card</button>
<div id="res"></div>
</div>
</div>

<script>
let OTP=0;
function sendOTP(){
 let email=document.getElementById('email').value;
 if(!email.includes('@')){ document.getElementById('loginErr').innerHTML='<div class=fail>Enter valid email</div>'; return; }
 OTP=Math.floor(100000+Math.random()*900000);
 localStorage.setItem('otp',OTP); localStorage.setItem('email',email);
 document.getElementById('otpPage').classList.remove('hidden');
 document.getElementById('loginErr').innerHTML='<div class=ok>OTP sent</div>';
 document.getElementById('otpShow').innerHTML='Demo OTP: <b style="color:green;font-size:18px">'+OTP+'</b>';
}
function verifyOTP(){
 if(document.getElementById('otpInput').value==localStorage.getItem('otp')){
  localStorage.setItem('logged','yes'); showDash();
 } else { document.getElementById('loginErr').innerHTML='<div class=fail>Wrong OTP</div>'; }
}
function showDash(){ document.getElementById('loginPage').classList.add('hidden'); document.getElementById('dashPage').classList.remove('hidden'); document.getElementById('uname').innerText=localStorage.getItem('email'); }
function logout(){ localStorage.clear(); location.reload(); }
if(localStorage.getItem('logged')=='yes') showDash();

let CGPA=0, PER=0, F=0, P=0;
document.getElementById('file').addEventListener('change', async (e)=>{
 let file=e.target.files[0]; if(!file) return;
 let s=document.getElementById('status'); s.style.display='block'; s.innerText='Reading... 10 sec';
 try{
  let {data:{text}} = await Tesseract.recognize(file,'eng');
  document.getElementById('ocr').innerText=text.slice(0,700);
  let m=text.match(/(?:CGPA|SGPA)[^0-9]{0,15}([0-9]\.[0-9]{1,2})/i);
  let cg=m?parseFloat(m[1]):0; if(!cg){ let all=text.match(/([0-9]\.[0-9]{1,2})/g); if(all) for(let v of all){ let n=parseFloat(v); if(n>=4&&n<=10) cg=n; } }
  CGPA=cg; PER=Math.round((cg-0.5)*10*10)/10;
  let f=0,p=0; text.split('\n').forEach(l=>{
   let u=l.toUpperCase().trim();
   if(u.includes('UNIVERSITY')||u.includes('BACHELOR')||u.length<15) return;
   if(/2[0-9][A-Z]{2,}[0-9]/.test(u)){ let last=u.split(/\s+/).pop(); if(last=='F') f++; if(last=='P') p++; }
  });
  F=f; P=p;
  s.innerText=`Found: CGPA ${CGPA} = ${PER}% | P=${p} F=${f}`;
  document.getElementById('btn').disabled=false; document.getElementById('btn').innerText='Check Eligibility';
 }catch(err){ s.innerText='Error: '+err.message; }
});

document.getElementById('btn').onclick=()=>{
 let cat=document.getElementById('cat').value, inc=document.getElementById('income').value, r=document.getElementById('res');
 if(!cat||CGPA==0){ r.innerHTML='<div class=fail>Upload & select category</div>'; return; }
 if(inc>1000000){ r.innerHTML='<div class=fail>❌ Income >10L - Not Eligible</div>'; return; }
 if(CGPA<4 || F>0){ r.innerHTML=`<div class=fail>❌ NOT ELIGIBLE<br>CGPA ${CGPA} (${PER}%)<br>P=${P} F=${F}<br>Rule: Need CGPA>=4 AND F=0</div>`; return; }
 r.innerHTML=`<div class=ok>✅ ELIGIBLE<br>CGPA ${CGPA} = ${PER}%<br>All PASS - No Backlog</div>`;
};
</script>
</body>
</html>
