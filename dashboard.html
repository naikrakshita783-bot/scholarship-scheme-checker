<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Eligibility</title>
<style>
body{font-family:Arial;background:#f4f6f9;display:flex;justify-content:center;padding:20px;margin:0}
.card{background:white;padding:25px;border-radius:16px;width:100%;max-width:450px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h2{text-align:center} select,input,button{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1.5px solid #ddd;font-size:16px;box-sizing:border-box}
button{background:#198754;color:white;border:none;font-weight:bold;cursor:pointer}
.result{padding:12px;border-radius:10px;margin-top:10px}
.ok{background:#d4edda} .fail{background:#f8d7da}
</style>
</head>
<body>
<div class="card">
<h2>Check Scholarship Eligibility</h2>
<p id="welcome" style="text-align:center;color:green"></p>
<select id="cat">
<option value="">Select Category</option>
<option>SC</option><option>ST</option><option>OBC-2A</option><option>OBC-3A</option><option>Minority</option><option>General</option>
</select>
<input id="income" type="number" placeholder="Annual Family Income (eg: 80000)">
<input id="marks" type="number" placeholder="Last Year % (eg: 75)">
<button onclick="check()">Check Eligibility</button>
<div id="res"></div>
<button onclick="logout()" style="background:#dc3545;margin-top:15px">Logout</button>
</div>
<script>
document.getElementById('welcome').innerText = "Logged in: " + (localStorage.getItem('userPhone')||'Guest');
function check(){
 let c=document.getElementById('cat').value, i=parseInt(document.getElementById('income').value)||0, m=parseInt(document.getElementById('marks').value)||0;
 if(!c||!i||!m){ alert('Fill all fields'); return; }
 if(i > 1000000){ document.getElementById('res').innerHTML = '<div class="result fail">❌ NOT ELIGIBLE<br>Income > 10 Lakh</div>'; return; }
 let schemes=[
  {n:"SSP SC Scholarship",cat:["SC"],inc:250000,mar:50,amt:"Full Fees + Hostel"},
  {n:"SSP ST Scholarship",cat:["ST"],inc:250000,mar:50,amt:"Full Fees + Hostel"},
  {n:"SSP OBC Scholarship",cat:["OBC-2A","OBC-3A"],inc:100000,mar:60,amt:"Fee Reimbursement"},
  {n:"Minority MCM",cat:["Minority"],inc:200000,mar:50,amt:"Rs 20,000/year"},
  {n:"Central Sector",cat:["General","SC","ST","OBC-2A","OBC-3A","Minority"],inc:450000,mar:80,amt:"Rs 10k-20k/year"}
 ];
 let eligible = schemes.filter(s=>s.cat.includes(c) && i<=s.inc && m>=s.mar);
 document.getElementById('res').innerHTML = eligible.length ? 
  '<h3>✅ '+eligible.length+' Schemes Found</h3>' + eligible.map(s=>`<div class="result ok"><b>${s.n}</b><br>Benefit: ${s.amt}</div>`).join('') :
  '<div class="result fail">❌ No schemes found for this criteria</div>';
}
function logout(){ localStorage.clear(); window.location='index.html'; }
</script>
</body>
</html>
