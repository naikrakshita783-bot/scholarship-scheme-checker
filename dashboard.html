<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Scholarship Checker</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Arial;background:#f4f6f9;display:flex;justify-content:center;padding:20px;margin:0}
.card{background:white;padding:25px;border-radius:16px;width:100%;max-width:500px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h2{text-align:center} select,input,button{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1.5px solid #ddd;font-size:16px;box-sizing:border-box}
button{background:#198754;color:white;border:none;font-weight:bold;cursor:pointer}
button:disabled{background:gray}
.result{padding:15px;border-radius:10px;margin-top:15px;font-weight:bold;text-align:center}
.ok{background:#d4edda;color:#155724}.fail{background:#f8d7da;color:#721c24}
#aiBox{background:#eef2ff;padding:12px;border-radius:10px;margin:10px 0;font-size:13px;display:none}
</style>
</head>
<body>
<div class="card">
<h2>Secure Eligibility Check</h2>
<p id="welcome" style="text-align:center;color:green"></p>

<select id="cat">
<option value="">Select Category</option>
<option>SC</option><option>ST</option><option>OBC-2A</option><option>OBC-3A</option><option>Minority</option><option>General</option>
</select>

<input id="income" type="number" placeholder="Annual Family Income (eg: 80000)">

<label><b>Upload Marks Card (Original) - AI will verify:</b></label>
<input id="file" type="file" accept="image/*" capture="environment">

<div id="aiBox">
<p id="aiStatus">🤖 AI Reading...</p>
<p id="aiText" style="font-size:11px;color:#555"></p>
</div>

<button id="checkBtn" onclick="check()" disabled>Upload Marks Card First</button>
<div id="res"></div>
<button onclick="logout()" style="background:#dc3545;margin-top:15px">Logout</button>
</div>

<script>
document.getElementById('welcome').innerText = "Logged in: " + (localStorage.getItem('userPhone')||'');
let aiData = { isFail: false, percentage: 0, valid: false };

document.getElementById('file').addEventListener('change', async function(e){
 let file = e.target.files[0]; if(!file) return;
 document.getElementById('aiBox').style.display='block';
 document.getElementById('aiStatus').innerText = "🤖 AI is reading your marks card... Wait 5 sec";
 document.getElementById('checkBtn').disabled = true;
 document.getElementById('checkBtn').innerText = "AI Reading...";

 try{
  const result = await Tesseract.recognize(file, 'eng');
  let text = result.data.text;
  let lower = text.toLowerCase();

  document.getElementById('aiText').innerText = "AI Read: " + text.substring(0,300);

  // 1. FAIL Detection - Cannot Cheat
  let failKeywords = ["fail", "atkt", "absent", "f ", " x ", "fail ", "failed"];
  let isFail = failKeywords.some(w => lower.includes(w)) || /\bF\b/.test(text) || /\[F\]/.test(text);

  // 2. Percentage Calculation from marks card
  // Find all numbers <=100
  let nums = text.match(/\d{1,3}/g)?.map(Number).filter(n=>n>=0 && n<=100) || [];
  let percentage = 0;
  if(nums.length > 0){
   // Average logic - remove very small numbers (like roll no)
   let filtered = nums.filter(n=>n>=20);
   if(filtered.length > 0){
    percentage = Math.round(filtered.reduce((a,b)=>a+b,0) / filtered.length);
   }
  }
  // If marks like 450/600 pattern found
  let totalMatch = text.match(/(\d{2,3})\s*\/\s*(\d{3})/);
  if(totalMatch){
   let obt = parseInt(totalMatch[1]); let tot = parseInt(totalMatch[2]);
   if(tot>0) percentage = Math.round((obt/tot)*100);
  }

  aiData.isFail = isFail;
  aiData.percentage = percentage;
  aiData.valid = percentage > 0;

  document.getElementById('aiStatus').innerHTML =
   `✅ AI Verified<br><b>Status:</b> ${isFail? '❌ FAIL Detected' : '✅ PASS'}<br><b>Auto Calculated %:</b> ${percentage}%<br><small>No one can cheat now - AI read from card</small>`;

  document.getElementById('checkBtn').disabled = false;
  document.getElementById('checkBtn').innerText = "Check Eligibility (AI Verified)";

 } catch(err){
  document.getElementById('aiStatus').innerText = "Error reading card, try clear photo";
 }
});

function check(){
 let cat = document.getElementById('cat').value;
 let income = parseInt(document.getElementById('income').value)||0;
 let resDiv = document.getElementById('res');

 if(!cat ||!income){ alert('Select category and income'); return; }
 if(!aiData.valid){ alert('Upload clear marks card first'); return; }

 // RULE 1: Income > 10 Lakh = NOT ELIGIBLE
 if(income > 1000000){
  resDiv.innerHTML = `<div class="result fail">❌ NOT ELIGIBLE<br>Reason: Income Rs ${income} > 10 Lakh Limit</div>`;
  return;
 }
 // RULE 2: AI says FAIL = NOT ELIGIBLE - Cannot Cheat
 if(aiData.isFail){
  resDiv.innerHTML = `<div class="result fail">❌ NOT ELIGIBLE<br>Reason: AI detected FAIL in marks card<br>Auto %: ${aiData.percentage}%<br>Cheating blocked!</div>`;
  return;
 }
 // RULE 3: Eligible
 let schemes=[
  {n:"SSP SC Scholarship",cat:["SC"],inc:250000,mar:50},
  {n:"SSP ST Scholarship",cat:["ST"],inc:250000,mar:50},
  {n:"SSP OBC Scholarship",cat:["OBC-2A","OBC-3A"],inc:100000,mar:60},
  {n:"Minority MCM",cat:["Minority"],inc:200000,mar:50},
  {n:"Central Sector",cat:["General","SC","ST","OBC-2A","OBC-3A","Minority"],inc:450000,mar:80}
 ];
 let eligible = schemes.filter(s=>s.cat.includes(cat) && income<=s.inc && aiData.percentage>=s.mar);

 resDiv.innerHTML = eligible.length?
  `<div class="result ok">✅ ELIGIBLE (AI Verified)<br>Category: ${cat}<br>Income: ${income}<br>AI Calculated %: ${aiData.percentage}% - PASS<br><br>Found ${eligible.length} Schemes:<br>${eligible.map(s=>`• ${s.n}`).join('<br>')}</div>` :
  `<div class="result fail">❌ NOT ELIGIBLE<br>Your % ${aiData.percentage}% is low for ${cat} category<br>(Need 60% for OBC, 50% for SC/ST)</div>`;
}
function logout(){ localStorage.clear(); location.href='index.html'; }
</script>
</body>
</html>
