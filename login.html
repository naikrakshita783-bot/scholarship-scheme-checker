<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Portal - Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: screen; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 360px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
        h2 { margin-bottom: 5px; color: #2c3e50; }
        p { color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 14px; }
        button { background: #0d6efd; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0b5ed7; }
        .hidden { display: none; }
        #msg { color: #27ae60; font-size: 13px; font-weight: 500; }
    </style>
    <script src="https://jsdelivr.net"></script>
</head>
<body>
<div class="card">
    <h2>Scholarship Portal</h2>
    <p>Secure Student OTP Verification</p>
    
    <div id="emailSection">
        <input id="email" type="email" placeholder="Enter your email address" required>
        <button onclick="sendEmailOTP()">Send Secure OTP</button>
    </div>

    <div id="otpSection" class="hidden">
        <input id="otp" type="text" maxlength="6" placeholder="Enter 6-digit OTP">
        <button onclick="verifyEmailOTP()">Verify Credentials</button>
    </div>
    
    <p id="msg"></p>
</div>

<script>
    emailjs.init("YOUR_PUBLIC_KEY"); // Replace with EmailJS Public Key
    let generatedOTP;

    function sendEmailOTP() {
        const email = document.getElementById('email').value;
        if (!email) { alert("Please enter a valid email."); return; }

        generatedOTP = Math.floor(100000 + Math.random() * 900000);
        document.getElementById('msg').innerText = "Generating authentication code...";

        emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', { to_email: email, otp_code: generatedOTP })
            .then(() => {
                document.getElementById('msg').innerText = "OTP dispatched successfully.";
                document.getElementById('otpSection').classList.remove('hidden');
            })
            .catch(err => { alert("Error sending OTP: " + err.text); });
    }

    function verifyEmailOTP() {
        if (document.getElementById('otp').value == generatedOTP) {
            window.location.href = "dashboard.html";
        } else {
            alert("Invalid OTP credentials. Try again.");
        }
    }
</script>
</body>
</html>
